<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <h1 align="center">Hotel Room Booking Form</h1>
    <hr>
        
    <form action="#" align="Center">

        <label for="Full Name" >Full Name :</label>
        <input type="text" name="Full Name" id="full name" required>
        <br><br>

        <label for="email">E-Mail :</label>
        <input type="email">
        <br><br>

        <label for="Phone">Phone :</label>
        <input type="tel" name="Phone" id="Phone">
        <br><br>

        <label for="Check In">Check In :</label>
        <input type="date" name="Check IN" id="Check IN">
        <br><br>

        <label for="Check Out">Check Out :</label>
        <input type="date" name="Check IN" id="Check OUT">
        <br><br>

        <label for="Room">Room Type :</label>
        <select name="Room" id="Room">
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Deluxe">Deluxe</option>
            <option value="Suite">Suite</option>
        </select>
        <br><br>

        <label for="Guest">No of Guest :</label>
        <input type="number" name="" id="">
        <br><br>

        <label for="Request">Special Request</label>
        <br>
        <textarea name="" id="" rows="4" cols="40"></textarea>
        <br><br>

        <!-- <input type="Submit" value="Book Now">
        <input type="Reset" value="Reset Form"> -->

        <Button type="submit">Book Now</Button>
        <Button type="reset">Reset Form</Button>

    </form>
    <footer align="center">
        &copy; 2025 Student Registration Portal
    </footer>

</body>
</html>
